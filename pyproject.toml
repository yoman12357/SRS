[project]
name = "cybersrs-sequential"
version = "0.1.0"
description = "Local sequential section agents for evidence-linked cybersecurity SRS and SDLC"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3", "httpx>=0.27,<1", "chromadb>=0.5,<0.6",
  "reportlab>=4,<5", "PyMuPDF>=1.24,<2", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.5", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]
